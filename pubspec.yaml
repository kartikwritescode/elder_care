name: elder_care
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  supabase: ^2.8.0
  get: ^4.7.2
  http: ^1.4.0
  file_picker: ^10.3.7
  google_sign_in: ^7.2.0
  flutter_launcher_icons: ^0.14.4
  font_awesome_flutter: ^10.8.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  supabase_flutter: ^2.9.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_datetime_picker_plus: ^2.2.0
  flutter_datetime_picker_bdaya: ^3.0.2
  glassmorphism: ^3.0.0
  lottie: ^3.3.1
  flutter_floating_bottom_bar: ^1.3.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  flutter_map: ^8.1.1
  sign_in_with_apple: ^7.0.1
  foundation: ^0.0.5
  flutter_web_auth_2: ^4.1.0
  app_links: ^6.4.1
  syncfusion_flutter_gauges: ^31.1.19
  battery_plus: ^7.0.0
  pedometer: ^4.1.1
  date_picker_timeline: ^1.2.7
  day_night_time_picker: ^1.3.1
  image_cropper: ^11.0.0
  package_info_plus: ^8.3.1
  latlong2: ^0.9.1
  audioplayers: ^6.5.1
  vibration: ^3.1.4
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  country_code_picker: ^3.4.1
  country_picker: ^2.0.27
  google_fonts: ^8.0.1
  shared_preferences: ^2.5.4
  health: ^13.3.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/eldercare_logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/eldercare_logo.png
  android: true
  ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/auth/
    - assets/
    - assets/images/
    - assets/sounds/
    - assets/lottie/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
